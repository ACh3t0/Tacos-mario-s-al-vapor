<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ventas | Tacos Mario's</title>
    <link rel="stylesheet" href="./ventas.css">
</head>

<script type="module">
    import { protegerPagina } from "../services/sesion.js";
    protegerPagina();
</script>

<body>
    <nav class="sidebar">
        <img class="logo" src="../img/Logotipo de Tacos Mario’s al Vapor.png" alt="logo de empresa">
        <ul>
            <li><a href="./main.html">Inicio</a></li>
            <li><a href="./inventario.html">Inventario</a></li>
            <li><a href="./usuarios.html">Usuarios</a></li>
            <li><a href="./ventas.html" aria-current="page">Ventas</a></li>
            <li><a href="./reportes.html">Reportes</a></li>
        </ul>
    </nav>
    <main>
        <h1>Registro de Ventas</h1>

        <section class="contenedor-venta">
            <div class="panel-agregar">
                <h3>Agregar Producto</h3>
                <label for="select-producto">Producto:</label>
                <select id="select-producto">
                    <option value="">Cargando productos...</option>
                </select>

                <label for="input-cantidad">Cantidad:</label>
                <input type="number" id="input-cantidad" min="1" step="1" value="1">

                <button id="btn-agregar" type="button">Agregar a la orden</button>
            </div>

            <div class="panel-orden">
                <h3>Detalle de la Orden</h3>
                <table id="tabla-orden">
                    <thead>
                        <tr>
                            <th>Producto</th>
                            <th>Precio Unitario</th>
                            <th>Cantidad</th>
                            <th>Subtotal</th>
                            <th>Acción</th>
                        </tr>
                    </thead>
                    <tbody id="lista-orden">
                    </tbody>
                </table>

                <div class="resumen-cobro">
                    <h4>Total: $<span id="total-venta">0.00</span></h4>
                    
                    <label for="select-pago">Método de Pago:</label>
                    <select id="select-pago">
                        <option value="Efectivo">Efectivo</option>
                        <option value="Tarjeta">Tarjeta</option>
                        <option value="Transferencia">Transferencia</option>
                    </select>

                    <button id="btn-cobrar" type="button">Completar Venta</button>
                </div>
            </div>
        </section>
    </main>

    <script type="module" src="./ventas.js"></script>
</body>
</html>
