<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Inicio | Tacos Mario´s</title>
    <link rel="stylesheet" href="./main.css">
</head>

<body>
    <nav class="sidebar">
        <img class="logo" src="../img/Logotipo de Tacos Mario’s al Vapor.png" alt="logo de empresa">
        <ul>
            <li><a href="./main.html">Inicio</a></li>
            <li><a href="./inventario.html">Inventario</a></li>
            <li><a href="./usuarios.html">Usuarios</a></li>
            <li><a href="./ventas.html">Ventas</a></li>
            <li><a href="./reportes.html">Reportes</a></li>
        </ul>
    </nav>
    <main>
        <header class="encabezado">
            <h1>Pedidos</h1>
            <button id="actualizar-pedidos" type="button">Actualizar</button>
        </header>
        <p id="mensaje-pedidos" role="status" aria-live="polite">Cargando pedidos...</p>

        <section class="seccion-pedidos" aria-labelledby="titulo-activos">
            <h2 id="titulo-activos">Pedidos activos</h2>
            <div class="tabla-contenedor">
                <table>
                    <thead>
                        <tr>
                            <th>Pedido</th>
                            <th>Fecha</th>
                            <th>Registró</th>
                            <th>Productos</th>
                            <th>Total</th>
                            <th>Pago</th>
                            <th>Acción</th>
                        </tr>
                    </thead>
                    <tbody id="pedidos-activos"></tbody>
                </table>
            </div>
        </section>

        <section class="seccion-pedidos" aria-labelledby="titulo-completados">
            <h2 id="titulo-completados">Pedidos completados</h2>
            <div class="tabla-contenedor">
                <table>
                    <thead>
                        <tr>
                            <th>Pedido</th>
                            <th>Fecha</th>
                            <th>Registró</th>
                            <th>Productos</th>
                            <th>Total</th>
                            <th>Pago</th>
                        </tr>
                    </thead>
                    <tbody id="pedidos-completados"></tbody>
                </table>
            </div>
        </section>
    </main>

    <script type="module" src="./main.js"></script>
</body>
</html>
