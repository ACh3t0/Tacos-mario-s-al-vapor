<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tacos Mario´s</title>
    <link rel="stylesheet" href="login.css">
    <script type="module" src="./login.js"></script>

</head>
<body>

    <div class="cardContent">
        <h1 class="title">Tacos Mario´s</h1>

        <div class="formsCard">


            <form id="loginForm">
                
                <label class="userName">Nombre de ususario:</label>
                <input type="text" id="userName" required>

                <label class="password">Contraseña:</label>
                <input type="password" id="password" required>

                <label class="accountType">Tipo de cuenta:</label>
                <select class="foldingMenu">

                    <option value="employee">Empleado</option>
                    <option value="admin">Admin</option>
                    <option value="master">Desarrollador</option>
                </select>
            </div>
        <div class="buttonContainer">
            </form>
            <button type="submit" form="loginForm" class="loginBox">Iniciar sesión</button>
            <button type="button" class="register" onclick="window.location.href = 'register.html'">Registrar usuario</button>
        </div>
    </div>

</body>
</html>
